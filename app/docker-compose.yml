services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: byt3un1on/vitrine-dev
    working_dir: /app
    volumes:
      - ./:/app
      # Volume nomeado para node_modules nao ser encoberto pelo bind mount.
      - node_modules:/app/node_modules
    environment:
      WIREMOCK_BASE_URL: http://wiremock:8080
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      - wiremock
    command: ['sleep', 'infinity']

  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ['--verbose', '--global-response-templating']
    ports:
      - '8080'

volumes:
  node_modules:
