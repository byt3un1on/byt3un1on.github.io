name: Publicar a vitrine

# RNF-08: publicacao agendada diaria mantem a defasagem do catalogo abaixo de
# 24 h. O disparo manual existe para nao esperar a janela quando algo urgente
# entra na curadoria.
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [master]
  workflow_dispatch:

# Somente leitura por padrao; cada job pede o que precisa.
permissions:
  contents: read

concurrency:
  group: publicar-vitrine
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Tudo passa pelo contrato de operacao: o CI roda os mesmos alvos que a
      # maquina do autor, dentro do mesmo servico `dev`.
      - name: Subir a infraestrutura
        working-directory: app
        run: make infra

      # RF-14: se o catalogo nao puder ser obtido por inteiro, este passo falha
      # e nenhum passo de publicacao roda — a versao anterior fica no ar.
      - name: Montar o catalogo
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make catalog

      - name: Construir o sitio
        working-directory: app
        run: make build

      - name: Auditar acessibilidade e desempenho
        working-directory: app
        run: make audit

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist/browser

      - id: deploy
        uses: actions/deploy-pages@v4

      # RF-16: roda sempre, qualquer que tenha sido o desfecho. E por isso que o
      # reporte vive fora do comando de catalogo — aborto de build ou de
      # prerender tambem precisa abrir questao.
      - name: Registrar o desfecho
        if: always()
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make report ${{ job.status == 'success' && 'success' || 'failure' }} "publicacao ${{ job.status }} na execucao ${{ github.run_id }}"
