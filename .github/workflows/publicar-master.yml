# Estagio 4: a aprovacao da Pull Request de release publica a vitrine, integra
# em master e marca a versao. E o unico fluxo da esteira que publica.
name: Action - release -> master

run-name: Action - ${{ github.event.pull_request.head.ref }} -> master

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: publicar-master
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.ESTEIRA_TOKEN }}

jobs:
  build:
    name: Construção
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.base.ref == 'master'
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      # `init` junto de `infra`: o catalogo gerado nao e versionado, e sem o
      # arquivo de partida o build do Angular nao resolve o import.
      - name: Subir o serviço dev
        working-directory: app
        run: make infra init
      - name: Construir o sítio
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build
      - name: Nomear a versão
        id: versao
        run: echo "versao=${{ github.event.pull_request.head.ref }}" | sed 's|release/||' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: app/dist/browser
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Construção"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: ''
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: app/dist/browser
      # `init` junto de `infra`: o catalogo gerado nao e versionado, e sem o
      # arquivo de partida o build do Angular nao resolve o import.
      - name: Subir o serviço dev
        working-directory: app
        run: make infra init
      # Principio 9: nada e publicado sem a medicao passar. Aqui ela e portao.
      - name: Auditar acessibilidade e desempenho
        working-directory: app
        run: make audit-only
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Auditoria"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: ''
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publicação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: audit
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      # RF-14: publica o artefato que a auditoria aprovou. Nao ha `make build`
      # aqui, de proposito — construir de novo publicaria coisa nao verificada.
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sitio
      - id: pages
        uses: actions/deploy-pages@v4

  merge:
    name: Merge master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A integracao so acontece depois de a publicacao concluir: master passa a
    # descrever o que esta no ar, e nao o que se pretendia pôr no ar.
    needs: [build, deploy]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Integrar a release em master
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --merge --delete-branch 2>merge.log \
            || { echo "DETALHE=$(tail -c 400 merge.log)" >> "$GITHUB_ENV"; exit 1; }
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Merge master"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: "${{ env.DETALHE }}"
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag e release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, merge]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - name: Marcar e liberar a versão
        run: |
          gh release create "${{ needs.build.outputs.versao }}" --target master \
            --title "${{ needs.build.outputs.versao }}" --generate-notes
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Tag e release"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: "${{ needs.build.outputs.versao }}"
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"
