# Estagio 4: o que entra em master vai ao ar. E o unico fluxo da esteira que
# publica.
#
# O gatilho e o push em master, e nao a Pull Request que o causou. Nao e
# preferencia: o ambiente `github-pages` so aceita implantacao vinda de
# `refs/heads/master`, e uma execucao de `pull_request` carrega
# `refs/pull/<n>/merge` — a implantacao e recusada pela protecao do ambiente,
# como foi. O merge continua sendo o que dispara: e ele que produz o push.
name: Action - release -> master

run-name: Action - release -> master

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: publicar-master
  cancel-in-progress: false

env:
  # Este estagio nao encadeia nenhum outro, entao nao precisa da credencial
  # dedicada: a padrao publica, marca e libera sem disparar nada adiante.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Construção
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      # Historico completo: e dele que sai o numero da versao, e o push nao
      # carrega o nome da branch de release que acabou de entrar.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # `init` junto de `infra`: o catalogo gerado nao e versionado, e sem o
      # arquivo de partida o build do Angular nao resolve o import.
      - name: Subir o serviço dev
        working-directory: app
        run: make infra init
      - name: Construir o sítio
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build
      # A versao a publicar e a que ainda nao tem etiqueta: o mesmo calculo do
      # estagio 2, sobre o mesmo historico, devolve o mesmo numero. Conferido
      # antes de virar saida, como todo valor que atravessa jobs.
      - name: Nomear a versão
        id: versao
        working-directory: app
        run: |
          VERSAO=$(make -s pipeline version)
          case "$VERSAO" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              ESTEIRA_JOB="Construção" ESTEIRA_STATUS=failure \
                ESTEIRA_DETALHE="versao invalida: recebido '$VERSAO', esperado vX.Y.Z" \
                make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: app/dist/browser
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Construção"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: ''
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: app/dist/browser
      # `init` junto de `infra`: o catalogo gerado nao e versionado, e sem o
      # arquivo de partida o build do Angular nao resolve o import.
      - name: Subir o serviço dev
        working-directory: app
        run: make infra init
      # Principio 9: nada e publicado sem a medicao passar. Aqui ela e portao.
      - name: Auditar acessibilidade e desempenho
        working-directory: app
        run: make audit-only
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Auditoria"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: ''
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publicação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: audit
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      # RF-14: publica o artefato que a auditoria aprovou. Nao ha `make build`
      # aqui, de proposito — construir de novo publicaria coisa nao verificada.
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sitio
      - id: pages
        uses: actions/deploy-pages@v4

  release:
    name: Tag e release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A marca so existe depois de a publicacao concluir: a tag descreve o que
    # esta no ar, e nao o que se pretendia pôr no ar.
    needs: [build, deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # O resumo passa pelo contrato de operacao, entao o servico dev precisa
      # estar de pe tambem nos jobs que so falam com o GitHub.
      - name: Subir o serviço dev
        working-directory: app
        run: make infra init
      - name: Marcar e liberar a versão
        run: |
          gh release create "${{ needs.build.outputs.versao }}" --target master \
            --title "${{ needs.build.outputs.versao }}" --generate-notes
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Tag e release"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: "${{ needs.build.outputs.versao }}"
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"
