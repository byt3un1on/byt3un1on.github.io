# Estagio 3: a aprovacao da Pull Request de develop leva o conteudo a branch de
# release e abre a ultima Pull Request, a que publica. Nada e publicado aqui.
name: Action - develop -> release

run-name: Action - develop -> ${{ github.event.pull_request.base.ref }}

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: promover-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.ESTEIRA_TOKEN }}
  ESTEIRA_MODO: ${{ vars.ESTEIRA_MODO }}
  ESTEIRA_MODO_ROTULO: ${{ join(github.event.pull_request.labels.*.name, ',') }}

jobs:
  modo:
    name: Modo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.ref == 'develop' &&
      startsWith(github.event.pull_request.base.ref, 'release/')
    outputs:
      modo: ${{ steps.decidir.outputs.modo }}
    steps:
      - uses: actions/checkout@v5
      - name: Subir o serviço dev
        working-directory: app
        run: make infra
      - name: Decidir o modo
        id: decidir
        working-directory: app
        run: |
          # RF-20: sem a credencial dedicada a cadeia nao encadeia. Falhar
          # nomeando a causa vale mais que falhar no primeiro `gh` sem token.
          if [ -z "$GH_TOKEN" ]; then
            ESTEIRA_JOB=Modo ESTEIRA_STATUS=failure \
              ESTEIRA_DETALHE="credencial ESTEIRA_TOKEN ausente no repositorio" \
              make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "modo=$(make -s pipeline mode)" >> "$GITHUB_OUTPUT"
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Modo"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: "modo em vigor: ${{ steps.decidir.outputs.modo }}"
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: Merge release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: modo
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Integrar develop na release
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --merge --delete-branch=false 2>merge.log \
            || { echo "DETALHE=$(tail -c 400 merge.log)" >> "$GITHUB_ENV"; exit 1; }
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "Merge release"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: "${{ env.DETALHE }}"
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"

  pr:
    name: PR para master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [modo, merge]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Abrir a Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr create --base master --head "$RELEASE" \
            --title "PR - $RELEASE -> master" \
            --body "Aberta pela esteira. Aprovar publica a vitrine e cria a release."
      - name: Aprovar sozinha no modo automático
        if: needs.modo.outputs.modo == 'automatico'
        env:
          RELEASE: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr review "$(gh pr list --head "$RELEASE" --base master --state open --json number --jq '.[0].number')" \
            --approve --body "Aprovada pela esteira: modo automático em vigor."
      - name: Resumo
        if: always()
        working-directory: app
        env:
          ESTEIRA_JOB: "PR para master"
          ESTEIRA_STATUS: "${{ job.status }}"
          ESTEIRA_DETALHE: "modo: ${{ needs.modo.outputs.modo }}"
        run: make -s pipeline summary >> "$GITHUB_STEP_SUMMARY"
